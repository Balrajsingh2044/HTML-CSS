<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
    <style>
        body {
            background-color: lightcoral;
        }
        ol {
            list-style-type:decimal;
    

        }

        .ordered-list {
            list-style-type:lower-roman;
            list-style-image: url(../intro-to-html/Images/istockphoto-1133442802-612x612.jpg);

            /*If you want to create a fail safe for the list image we can
            use list-style: then define type and image both in the same line
            */
            list-style-position: inside;
        }

        .unordered-list ::marker {
            content: "THIS!!>>>>";
            color: blue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5rem;
            list-style-position: outside;

        }

    </style>
</head>
<body>
    <h2>Listing types:</h2>
    <ol start="5" reversed>
        <li>Unordered list</li>
        <ul type = "square" class = "unordered-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <li>Orderd list</li>
        <ol type = "i" start="6" class = "ordered-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ol>
    </ol>
</body>
</html>
